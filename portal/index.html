<style>
/* Layout: fast sidemeny til venstre (som KRS Sykkel), innhold i kort til høyre. Mørkt først, messing som aksent. */
:root{

  --display:"Poppins","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF1EE; --side:#E2E7E3; --panel:#FFFFFF; --panel-2:#F3F5F3; --line:#D5DBD7;
  --fg:#151917; --mut:#5A645F; --acc:#9C6A1C; --acc-ink:#FFFFFF; --acc-soft:rgba(156,106,28,.11);
  --ok:#24804E; --warn:#8F6200; --bad:#B53B28; --info:#2F639C; --shade:rgba(20,25,22,.45);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#EEF1EE; --side:#E2E7E3; --panel:#FFFFFF; --panel-2:#F3F5F3; --line:#D5DBD7;
  --fg:#151917; --mut:#5A645F; --acc:#9C6A1C; --acc-ink:#FFFFFF; --acc-soft:rgba(156,106,28,.11);
  --ok:#24804E; --warn:#8F6200; --bad:#B53B28; --info:#2F639C; --shade:rgba(20,25,22,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
a{color:var(--acc)}
button{font:inherit}
.tab{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;

.brand{display:flex;align-items:center;gap:14px;padding:6px 12px 24px;text-decoration:none;color:var(--fg);font:700 20px/1 var(--display);letter-spacing:.01em;white-space:nowrap}
.brand .bar{width:1px;height:36px;background:var(--fg);opacity:.75}
.menu-btn{display:none;background:none;border:1.5px solid var(--line);color:var(--fg);border-radius:10px;padding:8px;cursor:pointer}
.navwrap{display:flex;flex-direction:column;flex:1;gap:2px}
.nav{display:flex;flex-direction:column;gap:2px}

.badge{margin-left:auto;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--panel-2);color:var(--fg);

.att{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

  color:var(--fg);text-decoration:none;border-left:3px solid var(--info)}

.prop .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

.dots{display:flex;gap:5px}

.segs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px;gap:4px}

.segs button.on{background:var(--acc);color:var(--acc-ink)}
.mnav{display:flex;align-items:center;gap:8px}

.iconbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--fg);cursor:pointer;font-size:20px;line-height:1}

.task{display:flex;gap:14px;align-items:flex-start;padding:14px 4px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);background:none;cursor:pointer;display:grid;place-items:center;color:var(--acc-ink);margin-top:1px}
.check.on{background:var(--ok);border-color:var(--ok)}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .t{font-weight:600;font-size:17px}
.task.done .t{text-decoration:line-through;color:var(--mut)}
.task .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mut);margin-top:4px}
.task .note{font-size:14px;color:var(--mut);margin-top:6px;max-width:70ch}

.mb{position:fixed;inset:0;background:var(--shade);z-index:50;overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(700px,100%);padding:26px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.x{background:none;border:0;color:var(--mut);font-size:30px;line-height:1;cursor:pointer;padding:0 4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full,.fsec{grid-column:1/-1}
.fsec{margin:12px 0 -2px;color:var(--acc);font-size:16px}
.lab{font-weight:600;font-size:14px}
.lab em{font-style:normal;color:var(--mut);font-weight:500}
.hint{font-size:13px;color:var(--mut)}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--fg);font:16px/1.4 var(--body)}

.mf{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.mf .sp{flex:1}
.ferr{color:var(--bad);font-size:14px;margin-top:12px}
.pp{position:relative}
.pp-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:5;overflow:hidden;box-shadow:0 12px 30px var(--shade)}
.pp-list button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;background:none;border:0;color:var(--fg);cursor:pointer;text-align:left}
.pp-list button:hover{background:var(--panel-2)}
.pp-list img{width:24px;height:24px;border-radius:50%}
.pp-list .none{padding:10px 12px;color:var(--mut);font-size:14px}

.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .card{width:min(440px,100%);padding:32px}
.auth .brand{padding:0 0 22px}
.auth form{display:flex;flex-direction:column;gap:14px}
.auth .btn{width:100%;margin-top:6px}
.auth p{margin:0 0 6px;color:var(--mut)}
.me .acts{display:flex;gap:12px;margin-top:4px}
.me .acts .linkbtn{font-size:13px}
.copy{display:flex;gap:8px}.copy .inp{font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 12px));background:var(--fg);color:var(--bg);
  padding:12px 20px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:var(--side)}
.note-bar{padding:12px 16px;border-radius:12px;background:var(--panel-2);color:var(--mut);font-size:15px}

.sb-fil{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--panel-2);border-left:3px solid var(--acc);min-height:48px}
.sb-fil b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-fil .linkbtn{margin-left:auto}
.sb-eb{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0 0 6px}
.sb-merk{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:80ch}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:900px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;flex-wrap:wrap;align-items:center;overflow:visible;
    border-right:0;border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{padding:0}
  .menu-btn{display:inline-flex;margin-left:auto}

  .side.open .navwrap{display:flex}
  .main{padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:640px){
  .kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:21px}

}
@media (prefers-reduced-motion:no-preference){.btn,.nav a{transition:background .15s,border-color .15s,filter .15s}}
</style>

<script>
/* ---------- hjelpere ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('nb-NO', {maximumFractionDigits:0});
const nfIn = new Intl.NumberFormat('nb-NO', {maximumFractionDigits:2});
const num = v => { if (typeof v === 'number') return v; const n = parseFloat(String(v ?? '').replace(/[\s  ]/g,'').replace(',','.')); return isNaN(n) ? 0 : n; };
const kr = n => (n == null || !isFinite(n)) ? '–' : nf.format(Math.round(n)) + ' kr';
const krS = n => { if (n == null || !isFinite(n)) return '–'; const a=Math.abs(n); return a >= 1e6 ? (n/1e6).toLocaleString('nb-NO',{maximumFractionDigits:2})+' mill.' : kr(n); };
const pct = n => isFinite(n) ? (n*100).toLocaleString('nb-NO',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' %' : '–';
const pad = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO = () => isoOf(new Date());
const curYM = () => todayISO().slice(0,7);
const pDate = iso => new Date(iso + 'T00:00:00');
const fmtDate = iso => iso ? new Intl.DateTimeFormat('nb-NO',{day:'numeric',month:'short',year:'numeric'}).format(pDate(iso)) : '–';
const daysUntil = iso => Math.round((pDate(iso) - pDate(todayISO())) / 864e5);
const mLabel = ym => { const [y,m] = ym.split('-').map(Number); return new Intl.DateTimeFormat('nb-NO',{month:'long',year:'numeric'}).format(new Date(y,m-1,1)); };
const mShort = ym => { const [y,m] = ym.split('-').map(Number); return new Intl.DateTimeFormat('nb-NO',{month:'short'}).format(new Date(y,m-1,1)); };
const shiftYM = (ym, d) => { const [y,m] = ym.split('-').map(Number); const t = new Date(y, m-1+d, 1); return t.getFullYear()+'-'+pad(t.getMonth()+1); };
function months(from, to){ const out=[]; let ym=from, g=0; while (ym <= to && g++ < 240){ out.push(ym); ym = shiftYM(ym,1); } return out; }
const sum = (arr, f) => arr.reduce((a,x) => a + (f(x) || 0), 0);

/* ---------- ikoner ---------- */
const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  tasks:'<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/>',

const erAktiv = (l, ym) => { const s = (l.kontraktStart || '0000-01').slice(0,7), e = (l.kontraktSlutt || '9999-12').slice(0,7); return s <= ym && ym <= e; };
const aktive = (eid, ym = curYM()) => (S.leietakere || []).filter(l => l.eiendomId === eid && erAktiv(l, ym));
const forsikringAr = eid => sum((S.forsikringer || []).filter(f => f.eiendomId === eid), f => num(f.premieAr));
function calc(e){
  const total = num(e.kjopesum)+num(e.dokumentavgift)+num(e.etablering)+num(e.omkostninger)+num(e.oppgradering);
  const kontrakt = sum(aktive(e.id), l => num(l.leieMnd)) * 12;
  const leie = kontrakt > 0 ? kontrakt : num(e.budsjettLeieAr);
  const felles = num(e.felleskostMnd)*12, fors = forsikringAr(e.id), andre = num(e.andreKostAr);
  const drift = felles + fors + andre, netto = leie - drift, rente = num(e.renteAr), etterRente = netto - rente, avdrag = num(e.avdragAr), cash = etterRente - avdrag;
  const ek = num(e.egenkapital), lan = num(e.lan), verdi = num(e.verdi) || total;
  return { total, kontrakt, leie, kilde: kontrakt > 0 ? 'kontrakt' : 'budsjett', felles, fellesUkjent: e.felleskostMnd == null || e.felleskostMnd === '', fors, andre, drift, netto, rente, etterRente, avdrag, cash, ek, lan, verdi,
    yld: total ? leie/total : NaN, roe: ek ? etterRente/ek : NaN, ltv: verdi ? lan/verdi : NaN, ledig: kontrakt === 0 };
}
const betaling = (l, ym) => (S.betalinger || []).find(b => b.leietakerId === l.id && b.periode === ym);
const forfall = (l, ym) => ym + '-' + pad(Math.min(28, Math.max(1, num(l.forfallsdag) || 1)));
function status(l, ym){
  const b = betaling(l, ym);
  if (b && num(b.belop) >= num(l.leieMnd)) return {k:'betalt', b};
  if (b) return {k:'delvis', b};
  return todayISO() > forfall(l, ym) ? {k:'forfalt'} : {k:'venter'};
}
const STATUS = { betalt:['ok','Betalt'], delvis:['warn','Delvis betalt'], forfalt:['bad','Forfalt'], venter:['nodot','Ikke forfalt'] };
function utestaende(){
  const out = [], cur = curYM();
  for (const l of S.leietakere || []){
    const start = [(l.kontraktStart || '').slice(0,7), l.betalingFra || cur].filter(Boolean).sort().pop();
    for (const ym of months(start, cur)){
      if (!erAktiv(l, ym)) continue;
      const s = status(l, ym);
      if (s.k === 'forfalt' || (s.k === 'delvis' && todayISO() > forfall(l, ym))) out.push({l, ym, rest: num(l.leieMnd) - num(s.b?.belop)});
    }
  }
  return out;
}

function field(f, v){
  if (f.sec) return `<h3 class="fsec">${esc(f.sec)}</h3>`;
  const id = 'f_' + f.k, val = v == null ? '' : v;
  let input;
  if (f.t === 'select'){
    const opts = typeof f.o === 'function' ? f.o() : f.o.map(x => [x, x]);
    input = `<select id="${id}" class="inp">${opts.map(([ov, ol]) => `<option value="${esc(ov)}" ${String(ov) === String(val) ? 'selected' : ''}>${esc(ol)}</option>`).join('')}</select>`;
  } else if (f.t === 'textarea') input = `<textarea id="${id}" class="inp" rows="3">${esc(val)}</textarea>`;
  else if (f.t === 'person') input = `<div class="pp"><input id="${id}" class="inp" autocomplete="off" placeholder="${user ? 'Søk etter navn' : 'Ikke tilgjengelig her'}" ${user ? '' : 'disabled'} data-pid="${esc(val)}"><div class="pp-list" hidden></div></div>`;
  else if (f.t === 'num') input = `<input id="${id}" class="inp tab" inputmode="decimal" value="${val === '' ? '' : esc(nfIn.format(num(val)))}">`;
  else input = `<input id="${id}" class="inp" type="${f.t || 'text'}" value="${esc(val)}">`;
  return `<label class="fld ${f.full ? 'full' : ''}" for="${id}"><span class="lab">${esc(f.l)}${f.u ? ` <em>(${esc(f.u)})</em>` : ''}</span>${input}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</label>`;
}

function errMsg(e){

  if (c === 'quota_exceeded') return 'Databasen er full. Slett gamle poster og prøv igjen.';

async function saveForm(ev){
  ev.preventDefault();
  if (!M || !db) return;
  const {col, doc, def, docId} = M, vals = {};
  for (const f of def.f){
    if (f.sec) continue;
    const el = $('#f_' + f.k); if (!el) continue;
    vals[f.k] = f.t === 'num' ? (el.value.trim() === '' ? null : num(el.value)) : f.t === 'person' ? (el.dataset.pid || '') : el.value.trim();
    if (f.req && (vals[f.k] === '' || vals[f.k] == null)){ const fe = $('#ferr'); fe.textContent = `Fyll inn «${f.l}».`; fe.hidden = false; el.focus(); return; }
  }
  const now = new Date().toISOString(), meta = {endret: now, endretAv: me?.id || null};
  try {
    if (doc && col === 'saldobalanser' && vals.periode && vals.periode !== doc.id){
      const {id, ...rest} = doc; await db.collection(col).doc(vals.periode).set({...rest, ...vals, ...meta}); await db.collection(col).doc(id).delete();
    } else if (doc){ const {id, ...rest} = doc; await db.collection(col).doc(id).set({...rest, ...vals, ...meta}); }
    else {
      const body = {...vals, ...(M.extraVals || {}), ...meta, opprettet: now, opprettetAv: meta.endretAv, ...(def.extra ? def.extra() : {})};
      const fid = docId || (col === 'saldobalanser' ? vals.periode : null);
      if (fid) await db.collection(col).doc(fid).set(body); else await db.collection(col).add(body);
    }
    closeModal(); toast('Lagret');
  } catch (e){ toast(errMsg(e), true); }
}

function setupPickers(){
  document.querySelectorAll('#mform .pp').forEach(pp => {
    const inp = pp.querySelector('input'), list = pp.querySelector('.pp-list');
    if (!user) return;
    if (inp.dataset.pid) user.profiles([inp.dataset.pid]).then(ps => { inp.value = ps[inp.dataset.pid]?.name || 'Ukjent person'; });
    const show = async () => {
      const hits = await user.search(inp.value.trim() === '' || inp.dataset.pid ? '' : inp.value.trim());
      list.innerHTML = '';
      if (!hits.length){ list.innerHTML = '<div class="none">Ingen treff. Skriv et navn.</div>'; }
      hits.forEach(h => {
        const b = document.createElement('button'); b.type = 'button';
        const img = document.createElement('img'); img.src = h.avatarUrl; img.alt = '';
        const s = document.createElement('span'); s.textContent = h.name + (h.isMe ? ' (deg)' : '');
        b.append(img, s);
        b.addEventListener('mousedown', e => { e.preventDefault(); inp.value = h.name; inp.dataset.pid = h.id; list.hidden = true; });
        list.append(b);
      });
      const clr = document.createElement('button'); clr.type = 'button'; clr.textContent = 'Ingen ansvarlig';
      clr.addEventListener('mousedown', e => { e.preventDefault(); inp.value = ''; inp.dataset.pid = ''; list.hidden = true; });
      list.append(clr);
      list.hidden = false;
    };
    inp.addEventListener('focus', show);
    inp.addEventListener('input', () => { inp.dataset.pid = ''; show(); });
    inp.addEventListener('blur', () => setTimeout(() => list.hidden = true, 120));
  });
}

function attention(){
  const A = [];
  for (const u of utestaende()) A.push({s:3, txt:`${esc(u.l.navn)} har ikke betalt for ${mLabel(u.ym)}`, meta:kr(u.rest), h:'innbetalinger'});
  for (const g of S.gjoremal.filter(g => !g.ferdig && g.frist)){
    const d = daysUntil(g.frist);
    if (d < 0) A.push({s:3, txt:`Fristen er passert: ${esc(g.tittel)}`, meta:fmtDate(g.frist), h:'gjoremal'});
    else if (d <= 7) A.push({s:2, txt:`Frist ${d === 0 ? 'i dag' : 'om ' + d + ' dager'}: ${esc(g.tittel)}`, meta:fmtDate(g.frist), h:'gjoremal'});
  }
  for (const l of S.leietakere){ if (!l.kontraktSlutt) continue; const d = daysUntil(l.kontraktSlutt);
    if (d >= 0 && d <= 180) A.push({s:2, txt:`Kontrakten med ${esc(l.navn)} går ut om ${d} dager`, meta:fmtDate(l.kontraktSlutt), h:'leietakere'}); }
  for (const f of S.forsikringer){
    if (viaSameie(f)) continue;
    if (f.fornyes){ const d = daysUntil(f.fornyes); if (d <= 60) A.push({s:2, txt:`${esc(f.type || 'Forsikring')} for ${esc(eNavn(f.eiendomId))} ${d < 0 ? 'skulle vært fornyet' : 'fornyes om ' + d + ' dager'}`, meta:fmtDate(f.fornyes), h:'forsikringer'}); }
    if (!f.selskap || !f.polisenr) A.push({s:1, txt:`Forsikringen for ${esc(eNavn(f.eiendomId))} mangler selskap eller polisenummer`, h:'forsikringer'});
  }
  for (const e of S.eiendommer){ if (calc(e).fellesUkjent) A.push({s:1, txt:`Felleskostnaden for ${esc(e.navn)} er ikke avklart`, meta:'Regnes som 0 kr', h:'eiendommer'}); }
  for (const e of S.eiendommer){ if (calc(e).ledig) A.push({s:1, txt:`${esc(e.navn)} står ledig${e.annonseStatus === 'Aktiv' && e.annonsePris ? ' og er annonsert for ' + kr(e.annonsePris) + ' / mnd' : ''}`, h:'eiendommer'}); }
  return A.sort((a, b) => b.s - a.s);
}

const AAR = 6; /* som i porteføljeoversikten: nåverdi og seks år fram */
const proj = (x, i) => x.c.verdi * Math.pow(1 + num(x.e.verdistigning) / 100, i);
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))), m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
const mill = v => v === 0 ? '0' : (v / 1e6).toLocaleString('nb-NO', {maximumFractionDigits: 2}) + ' mill.';
function verdiGraf(cs, yrs){
  const W = 760, H = 280, L = 70, R = 92, T = 18, B = 36;
  const labels = ['Kjøpt', 'I dag', ...yrs.map(String)];
  const ser = cs.map((x, k) => ({n: x.e.navn, col: k % 2 ? 'var(--info)' : 'var(--acc)', v: [num(x.e.kjopesum), x.c.verdi, ...yrs.map((_, i) => proj(x, i + 1))]}));
  const max = Math.max(1, ...ser.flatMap(s => s.v)), step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const X = i => L + i * (W - L - R) / (labels.length - 1), Y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top + 1; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 10}" y="${Y(v) + 4}" text-anchor="end" style="fill:var(--mut)" font-size="12">${mill(v)}</text>`;
  g += labels.map((l, i) => `<text x="${X(i)}" y="${H - 12}" text-anchor="middle" style="fill:var(--mut)" font-size="12">${l}</text>`).join('');
  g += `<line x1="${X(1)}" x2="${X(1)}" y1="${T}" y2="${H - B}" style="stroke:var(--mut)" stroke-dasharray="2 4"/>`;
  for (const s of ser){
    const pts = s.v.map((v, i) => `${X(i)},${Y(v)}`);
    g += `<polyline points="${pts.slice(0, 2).join(' ')}" fill="none" style="stroke:${s.col}" stroke-width="3" stroke-linecap="round"/>`;
    g += `<polyline points="${pts.slice(1).join(' ')}" fill="none" style="stroke:${s.col}" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>`;
    g += s.v.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="${i < 2 ? 5 : 3.5}" style="fill:${i < 2 ? s.col : 'var(--panel)'};stroke:${s.col}" stroke-width="2"><title>${esc(s.n)} – ${labels[i]}: ${kr(v)}</title></circle>`).join('');
    g += `<text x="${X(labels.length - 1) + 10}" y="${Y(s.v[s.v.length - 1]) + 4}" style="fill:${s.col}" font-size="13" font-weight="700">${mill(s.v[s.v.length - 1])}</text>`;
  }
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;display:block" role="img" aria-label="Verdiutvikling fra kjøpesum til ${yrs[yrs.length - 1]}">${g}</svg></div>
    <div class="row small" style="gap:18px;margin:8px 0 18px">${ser.map(s => `<span class="row" style="gap:8px"><i style="width:14px;height:4px;border-radius:2px;background:${s.col}"></i>${esc(s.n)}</span>`).join('')}<span class="muted">Heltrukket: faktisk. Stiplet: forventet.</span></div>`;
}
function verdiSeksjon(cs, yr){

  const sg = n => n > 0 ? '+' : '';

  const gain = (lab, f, base, cls = '') => { const c = (g, b) => `<td class="r ${g < 0 ? 'neg' : ''}">${sg(g)}${kr(g)}<div class="muted small">${b ? sg(g) + pct(g / b) : ''}</div></td>`;
    return `<tr class="${cls}"><td>${lab}</td>${cs.map(x => c(f(x), base(x))).join('')}${multi ? c(sum(cs, f), sum(cs, base)) : ''}</tr>`; };

      ${val('Nåverdi', x => x.c.verdi, 'em')}
      ${gain('Verdiøkning fra kjøpesum', x => x.c.verdi - num(x.e.kjopesum), x => num(x.e.kjopesum))}
      ${gain('Verdiøkning fra totalt investert', x => x.c.verdi - x.c.total, x => x.c.total)}
      <tr><td colspan="${cs.length + (multi ? 2 : 1)}" style="padding-top:22px"><b class="muted small" style="letter-spacing:.1em;text-transform:uppercase">Forventet verdi</b> <span class="muted small">(${cs.map(x => esc(x.e.navn) + ': ' + nfIn.format(num(x.e.verdistigning)) + ' % per år').join(' · ')})</span></td></tr>
      ${yrs.map((y, i) => val(String(y), x => proj(x, i + 1))).join('')}
      ${gain(`Verdiøkning fra totalt investert til ${yrs[AAR - 1]}`, x => last(x) - x.c.total, x => x.c.total, 'em sum')}
    </tbody></table></div></section>`;
}

/* ---------- saldobalanse (fylles inn for hånd) ---------- */
let sbYM = null;
function sbTall(d){
  const inn = num(d.inntekter), kost = num(d.kostnader);
  return { rest: num(d.restgjeld), oss: num(d.gjeldTilOss), bank: num(d.bank), inn, kost,
    res: d.resultat != null && d.resultat !== '' ? num(d.resultat) : inn - kost };
}
const SB_TEKST = 'Last opp saldobalansen som CSV fra regnskapssystemet. Portalen leser kontoene og fyller ut restgjeld, gjeld til eierne, bank, inntekter, kostnader og resultat.';
/* tall på norsk format: «1 297 675,00», «-30 000,00», «(1 234,50)» */
function sbTallFra(v){
  let t = String(v ?? '').replace(/["\s  ]/g, '');
  if (!t || t === '-') return null;
  let neg = false;
  if (/^\(.*\)$/.test(t)){ neg = true; t = t.slice(1, -1); }
  if (t.endsWith('-')){ neg = !neg; t = t.slice(0, -1); }
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  const n = Number(t); return isFinite(n) ? (neg ? -n : n) : null;
}
function sbDelLinje(l, sep){
  const out = []; let cur = '', q = false;
  for (let i = 0; i < l.length; i++){
    const c = l[i];
    if (c === '"'){ if (q && l[i + 1] === '"'){ cur += '"'; i++; } else q = !q; }
    else if (c === sep && !q){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur); return out.map(x => x.trim());
}
function sbLesCsv(tekst){
  const rader = tekst.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  if (!rader.length) throw new Error('Filen er tom.');
  const sep = [';', '\t', ','].map(s => [s, (rader[0].match(new RegExp(s === '\t' ? '\t' : s, 'g')) || []).length]).sort((a, b) => b[1] - a[1])[0][0];
  const tabell = rader.map(l => sbDelLinje(l, sep));
  const hi = tabell.findIndex(r => r.some(c => /konto/i.test(c)));
  const hode = hi >= 0 ? tabell[hi].map(c => c.toLowerCase()) : [];
  const finn = re => hode.findIndex(c => re.test(c));
  let kNr = finn(/kontonr|^konto$|kontonummer/), kNavn = finn(/navn|tekst|beskrivelse/), kUB = finn(/^ub$|utgående|utg\. ?saldo|^saldo/);
  if (kNr < 0) kNr = 0; if (kNavn < 0) kNavn = 1;
  const linjer = [];
  for (const r of tabell.slice(hi + 1)){
    const nr = (r[kNr] || '').replace(/\D/g, '');
    if (!/^\d{4,}$/.test(nr)) continue;
    let ub = kUB >= 0 ? sbTallFra(r[kUB]) : null;
    if (ub == null){ for (let j = r.length - 1; j > kNavn; j--){ const v = sbTallFra(r[j]); if (v != null){ ub = v; break; } } }
    if (ub == null) continue;
    linjer.push({ konto: nr.slice(0, 4), navn: r[kNavn] || '', ub: Math.round(ub * 100) / 100 });
  }
  if (!linjer.length) throw new Error('Fant ingen kontolinjer. Sjekk at filen er en saldobalanse med kontonummer og saldo.');
  return linjer;
}
const EIER_RE = /gjeld til|aksjonær|eier|mellomregning|holding|nærstående/i;
function sbGruppe(l){
  const k = +l.konto;
  if (k < 1900) return 'eiendel';
  if (k < 2000) return 'bank';
  if (k < 2100) return 'egenkapital';
  if (k >= 2200 && k < 2250) return 'restgjeld';
  if ((k >= 2250 && k < 2300) || (k >= 2900 && k < 3000 && EIER_RE.test(l.navn))) return 'eiere';
  if (k < 3000) return 'annenGjeld';
  if (k < 4000 || (k >= 8000 && k < 8100)) return 'inntekt';
  return 'kostnad';
}
function sbBeregn(linjer){
  const s = g => linjer.filter(l => sbGruppe(l) === g).reduce((a, l) => a + l.ub, 0);
  const r2 = n => Math.round(n * 100) / 100;
  const inn = r2(-s('inntekt')), kost = r2(s('kostnad'));
  return { restgjeld: r2(-s('restgjeld')), gjeldTilOss: r2(-s('eiere')), bank: r2(s('bank')), inntekter: inn, kostnader: kost, resultat: r2(inn - kost) };
}
function sbGjettYM(filnavn, tekst){
  const m = String(filnavn).match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);
  if (m){ const d = new Date(+m[1], +m[2] - 1, +m[3] - 10); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  let best = null;
  for (const x of String(tekst).slice(0, 4000).matchAll(/\b(\d{1,2})\.(\d{1,2})\.(20\d{2})\b/g)){ const ym = x[3] + '-' + pad(+x[2]); if (+x[2] >= 1 && +x[2] <= 12 && (!best || ym > best)) best = ym; }
  return best || shiftYM(curYM(), -1);
}
async function sbLesFil(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder('utf-8').decode(buf);
  if (t.includes('�')) t = new TextDecoder('windows-1252').decode(buf);
  return t;
}
async function sbImporter(file){
  if (!file) return;
  if (!/\.(csv|txt|skv)$/i.test(file.name)) return toast('Velg en CSV-fil. Excel-filer må lagres som CSV først.', true);
  try {
    const tekst = await sbLesFil(file), linjer = sbLesCsv(tekst), tall = sbBeregn(linjer), periode = sbGjettYM(file.name, tekst);
    const finnes = (S.saldobalanser || []).some(x => x.periode === periode);
    openForm('saldobalanser', null, {periode, ...tall}, null,
      `<div class="note-bar small" style="margin:-6px 0 18px">Lest ${linjer.length} kontoer fra <b>${esc(file.name)}</b>. Sjekk måneden og tallene, og trykk Lagre.${finnes ? ' Det finnes allerede en saldobalanse for ' + mLabel(periode) + ', og den blir erstattet hvis du beholder samme måned.' : ''}</div>`);
    M.extraVals = { linjer, filnavn: file.name, kilde: 'csv' };

}
const SB_GRUPPER = [['eiendel', 'Eiendeler', 1], ['bank', 'Bank', 1], ['restgjeld', 'Lån fra bank', -1], ['eiere', 'Gjeld til eierne', -1], ['annenGjeld', 'Annen gjeld', -1], ['egenkapital', 'Egenkapital', -1], ['inntekt', 'Inntekter', -1], ['kostnad', 'Kostnader', 1]];
function sbKontoer(d){

  const admin = me?.rolle === 'admin';
  const lenkeKort = sisteLenke ? `<section class="card"><div class="card-h"><h2>Lenke til ${esc(sisteLenke.navn)}</h2></div>
    <p class="muted" style="margin:0 0 12px">Send lenken til ${esc(sisteLenke.navn)} på e-post eller SMS. Den gjelder i ${sisteLenke.dager} dager og kan bare brukes én gang. Der velger ${esc(sisteLenke.navn)} sitt eget passord.</p>
    <div class="copy"><input class="inp" id="lenke" readonly value="${esc(sisteLenke.url)}"><button class="btn primary" data-act="kopier">Kopier</button></div></section>` : '';
  return head('Selskapet', 'Eiere og tilgang', admin ? 'Inviter eierne og bestem hva hver enkelt kan gjøre. Alle logger inn med e-post og eget passord.' : 'Hvem som har tilgang til portalen.',
      admin ? `<button class="btn primary" data-act="inviter">Inviter eier</button>` : '') + lenkeKort + `
  <section class="card">${brukere.length ? `<div class="tw"><table class="tbl"><thead><tr><th>Navn</th>${admin ? '<th>E-post</th>' : ''}<th>Tilgang</th>${admin ? '<th>Status</th><th></th>' : ''}</tr></thead><tbody>
    ${brukere.map(b => `<tr><td><b>${esc(b.navn)}</b>${b.id === me?.id ? ' <span class="muted small">(deg)</span>' : ''}</td>${admin ? `<td>${esc(b.epost)}</td>` : ''}
      <td>${admin && b.id !== me?.id ? `<select class="inp" style="padding:6px 10px;width:auto" data-rolle="${esc(b.id)}">${Object.entries(ROLLE).map(([k, v]) => `<option value="${k}" ${b.rolle === k ? 'selected' : ''}>${v}</option>`).join('')}</select>` : esc(ROLLE[b.rolle] || b.rolle)}</td>
      ${admin ? `<td>${b.aktiv ? chip('ok', 'Aktiv') : b.invitert ? chip('warn', 'Invitert') : chip('nodot', 'Lenken har gått ut')}</td>
      <td class="r">${b.id !== me?.id ? `<button class="btn sm" data-act="ny-lenke" data-id="${esc(b.id)}" data-navn="${esc(b.navn)}">${b.aktiv ? 'Nytt passord' : 'Ny lenke'}</button> <button class="btn sm danger" data-act="fjern" data-id="${esc(b.id)}">Fjern</button>` : ''}</td>` : ''}</tr>`).join('')}
  </tbody></table></div>` : empty('Ingen eiere', '')}</section>
  ${admin ? `<p class="muted small" style="margin:0"><b>Administrator</b> kan alt, også invitere og fjerne eiere. <b>Kan endre</b> kan registrere innbetalinger, gjøremål og tall. <b>Kan se</b> kan bare lese. Glemmer noen passordet, trykker du «Nytt passord» og sender den nye lenken.</p>` : ''}`;
}
function openInviter(){
  $('#modal').innerHTML = `<form id="iform" novalidate><div class="mh"><h2>Inviter eier</h2><button type="button" class="x" data-act="close" aria-label="Lukk">×</button></div>
    <div class="fgrid"><label class="fld"><span class="lab">Navn</span><input id="i_navn" class="inp" autocomplete="off"></label>
    <label class="fld"><span class="lab">E-post</span><input id="i_epost" class="inp" type="email" autocomplete="off"></label>
    <label class="fld full"><span class="lab">Tilgang</span><select id="i_rolle" class="inp">${Object.entries(ROLLE).map(([k, v]) => `<option value="${k}" ${k === 'skriv' ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
    <div class="ferr" id="ferr" hidden></div>
    <div class="mf"><span class="sp"></span><button type="button" class="btn" data-act="close">Avbryt</button><button class="btn primary" type="submit">Lag invitasjon</button></div></form>`;
  M = {col: null}; $('#mb').hidden = false; $('#i_navn').focus();
  $('#iform').addEventListener('submit', async e => {
    e.preventDefault();
    const navn = $('#i_navn').value.trim(), epost = $('#i_epost').value.trim(), rolle = $('#i_rolle').value;
    try { const r = await api('/api/users', {action: 'inviter', navn, epost, rolle});
      sisteLenke = {navn, url: location.origin + r.lenke, dager: r.dager}; closeModal(); await hentBrukere(); render(); }
    catch (er){ const fe = $('#ferr'); fe.textContent = er.message; fe.hidden = false; }
  });
}
function openPassord(){
  $('#modal').innerHTML = `<form id="pform" novalidate><div class="mh"><h2>Bytt passord</h2><button type="button" class="x" data-act="close" aria-label="Lukk">×</button></div>
    <div class="fgrid"><label class="fld full"><span class="lab">Nåværende passord</span><input id="p_g" class="inp" type="password" autocomplete="current-password"></label>
    <label class="fld full"><span class="lab">Nytt passord</span><input id="p_n" class="inp" type="password" autocomplete="new-password"><span class="hint">Minst 10 tegn</span></label></div>
    <div class="ferr" id="ferr" hidden></div>
    <div class="mf"><span class="sp"></span><button type="button" class="btn" data-act="close">Avbryt</button><button class="btn primary" type="submit">Lagre</button></div></form>`;
  M = {col: null}; $('#mb').hidden = false; $('#p_g').focus();
  $('#pform').addEventListener('submit', async e => {
    e.preventDefault();
    try { await api('/api/auth', {action: 'bytt-passord', gammelt: $('#p_g').value, nytt: $('#p_n').value}); closeModal(); toast('Passordet er byttet'); }
    catch (er){ const fe = $('#ferr'); fe.textContent = er.message; fe.hidden = false; }
  });
}

/* ---------- ruting og rendering ---------- */
const ROUTES = { oversikt:vOversikt, gjoremal:vGjoremal, eiendommer:vEiendommer, leietakere:vLeietakere, innbetalinger:vInnbetalinger, okonomi:vOkonomi, saldo:vSaldo, forsikringer:vForsikringer, eiere:vEiere };
const NAV = [
  {h:'oversikt', t:'Oversikt', i:'home'},
  {h:'gjoremal', t:'Gjøremål', i:'tasks', b:() => S.gjoremal?.filter(g => !g.ferdig).length},
  {g:'Portefølje'},
  {h:'eiendommer', t:'Eiendommer', i:'building', b:() => S.eiendommer?.length},
  {h:'leietakere', t:'Leietakere', i:'people', b:() => S.leietakere?.filter(l => erAktiv(l, curYM())).length},
  {h:'innbetalinger', t:'Innbetalinger', i:'pay', b:() => S.leietakere && S.betalinger ? utestaende().length : 0, bad:true},
  {g:'Økonomi'},
  {h:'okonomi', t:'Økonomi', i:'chart'},
  {h:'saldo', t:'Saldobalanse', i:'ledger', b:() => S.saldobalanser?.length},
  {h:'forsikringer', t:'Forsikringer', i:'shield', b:() => S.forsikringer?.filter(forsMangler).length},
  {g:'Selskapet'},
  {h:'eiere', t:'Eiere og tilgang', i:'people'},
];
const route = () => { const h = location.hash.slice(1); return ROUTES[h] ? h : 'oversikt'; };
function renderNav(){
  const r = route();
  $('#nav').innerHTML = NAV.map(n => {
    if (n.g) return `<div class="ng">${n.g}</div>`;
    const b = n.b ? n.b() : 0;
    return `<a href="#${n.h}" class="${r === n.h ? 'on' : ''}" ${r === n.h ? 'aria-current="page"' : ''}>${ico(n.i)}<span>${n.t}</span>${b ? `<span class="badge ${n.bad ? 'bad' : ''}">${b}</span>` : ''}</a>`;
  }).join('');
}
function renderMe(){
  if (!me){ $('#me').innerHTML = ''; return; }
  $('#me').innerHTML = `<img alt="" src="${esc(me.avatarUrl)}"><div style="min-width:0"><b></b><span>${esc(ROLLE[me.rolle] || '')}</span>
    <div class="acts"><button class="linkbtn" data-act="passord">Bytt passord</button><button class="linkbtn" data-act="loggut">Logg ut</button></div></div>`;
  $('#me b').textContent = me.name || 'Deg';
}
let raf = 0;
function render(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(doRender); }
function doRender(){
  renderNav();
  const v = $('#view');
  if (COLS.some(c => S[c] === null)){ v.innerHTML = '<p class="muted">Henter data …</p>'; return; }
  let html = ROUTES[route()]();
  if (offline) html = `<div class="note-bar">Mistet forbindelsen til serveren. Last siden på nytt.</div>` + html;
  else if (!canWrite) html = `<div class="note-bar">Du kan se alt, men ikke endre. Be en administrator om å gi deg tilgangen «Kan endre».</div>` + html;
  v.innerHTML = html;
  fillNames();
}

/* ---------- hendelser ---------- */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'menu'){ const s = $('#side'); s.classList.toggle('open'); t.setAttribute('aria-expanded', s.classList.contains('open')); return; }
  if (a === 'close') return closeModal();
  if (a === 'del') return delDoc();
  if (a === 'goto'){ location.hash = t.dataset.h; return; }
  if (a === 'new'){ let def = {}; try { def = JSON.parse(t.dataset.def || '{}'); } catch {} return openForm(t.dataset.col, null, def); }
  if (a === 'edit'){ const d = (S[t.dataset.col] || []).find(x => x.id === t.dataset.id); if (d) openForm(t.dataset.col, d); return; }
  if (a === 'month'){ const d = +t.dataset.d; payYM = d === 0 ? curYM() : shiftYM(payYM, d); render(); return; }
  if (a === 'tab'){ taskTab = t.dataset.t; render(); return; }
  if (a === 'pay'){
    const l = S.leietakere.find(x => x.id === t.dataset.l), ym = t.dataset.ym; if (!l) return;
    openForm('betalinger', null, {belop: l.leieMnd, betaltDato: todayISO()}, `${l.id}_${ym}`,
      `<p class="muted" style="margin:-6px 0 18px">${esc(l.navn)} · ${esc(eNavn(l.eiendomId))} · leie for ${mLabel(ym)}</p>`);
    M.extraVals = {leietakerId: l.id, eiendomId: l.eiendomId, periode: ym};
    return;
  }
  if (a === 'editpay'){ const b = S.betalinger.find(x => x.id === t.dataset.id); if (b){ const l = S.leietakere.find(x => x.id === b.leietakerId);
    openForm('betalinger', b, {}, null, `<p class="muted" style="margin:-6px 0 18px">${esc(l?.navn || '')} · leie for ${mLabel(b.periode)}</p>`); } return; }
  if (a === 'sb-vis'){ sbYM = t.dataset.ym; render(); window.scrollTo(0, 0); return; }
  if (a === 'sb-nav'){ const L = sbListeAlle(), i = L.findIndex(x => x.periode === sbYM) + (+t.dataset.d); if (L[i]){ sbYM = L[i].periode; render(); } return; }
  if (a === 'inviter') return openInviter();
  if (a === 'passord') return openPassord();
  if (a === 'loggut'){ try { await api('/api/auth', {action: 'logout'}); } catch {} location.href = '/'; return; }
  if (a === 'kopier'){ const i = $('#lenke'); i.select(); try { await navigator.clipboard.writeText(i.value); toast('Lenken er kopiert'); } catch { document.execCommand('copy'); toast('Lenken er kopiert'); } return; }
  if (a === 'ny-lenke'){ try { const r = await api('/api/users', {action: 'ny-lenke', id: t.dataset.id}); sisteLenke = {navn: t.dataset.navn, url: location.origin + r.lenke, dager: r.dager}; await hentBrukere(); render(); window.scrollTo(0, 0); } catch (e){ toast(e.message, true); } return; }
  if (a === 'fjern'){
    if (t.dataset.armed !== '1'){ t.dataset.armed = '1'; t.classList.add('armed'); t.textContent = 'Trykk igjen'; return; }
    try { await api('/api/users', {action: 'fjern', id: t.dataset.id}); await hentBrukere(); render(); toast('Fjernet'); } catch (e){ toast(e.message, true); } return;
  }
  if (a === 'toggle'){
    if (!canWrite || !db) return;
    const g = S.gjoremal.find(x => x.id === t.dataset.id); if (!g) return;
    try { await db.collection('gjoremal').doc(g.id).update({ferdig: !g.ferdig, ferdigDato: !g.ferdig ? todayISO() : null, ferdigAv: !g.ferdig ? (me?.id || null) : null}); }
    catch (e){ toast(errMsg(e), true); }
  }
});
document.addEventListener('change', async ev => {
  if (ev.target.id === 'sb-csv'){ const f = ev.target.files?.[0]; ev.target.value = ''; return sbImporter(f); }
  const id = ev.target.dataset?.rolle; if (!id) return;
  try { await api('/api/users', {action: 'rolle', id, rolle: ev.target.value}); await hentBrukere(); toast('Tilgangen er endret'); } catch (e){ toast(e.message, true); render(); }
});
$('#mb').addEventListener('click', e => { if (e.target.id === 'mb') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && M) closeModal(); if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute?.('for') === 'sb-csv'){ e.preventDefault(); $('#sb-csv').click(); } });
window.addEventListener('hashchange', () => { $('#side').classList.remove('open'); render(); window.scrollTo(0, 0); });

/* ---------- API og innlogging ---------- */
async function api(url, data){
  const r = await fetch(url, data ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data), credentials: 'same-origin'} : {credentials: 'same-origin'});
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && url !== '/api/auth'){ location.reload(); throw new Error('Logget ut'); }
  if (!r.ok) throw Object.assign(new Error(j.melding || 'Noe gikk galt. Prøv igjen.'), {code: j.error});
  return j;
}
async function lastData(){
  try { const r = await api('/api/data'); COLS.forEach(c => S[c] = r.data[c] || []); offline = false; }
  catch { offline = true; COLS.forEach(c => { if (S[c] === null) S[c] = []; }); }
  render();
}
/* samme grensesnitt som den gamle databasen, så resten av koden er uendret */
db = { collection: c => ({
  add: async data => { const r = await api('/api/data', {op: 'add', col: c, data}); await lastData(); return r; },
  doc: id => ({
    set: async data => { await api('/api/data', {op: 'set', col: c, id, data}); await lastData(); },
    update: async data => { await api('/api/data', {op: 'update', col: c, id, data}); await lastData(); },
    delete: async () => { await api('/api/data', {op: 'delete', col: c, id}); await lastData(); }
  })
})};
const avatar = navn => { const ini = (navn || '?').split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72"><rect width="72" height="72" rx="36" fill="#9C6A1C"/><text x="36" y="45" font-family="Arial" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">${ini.replace(/[<&>]/g, '')}</text></svg>`); };
user = {
  profiles: async ids => Object.fromEntries(ids.map(id => { const b = brukere.find(x => x.id === id); return [id, b ? {name: b.navn} : null]; })),
  search: async q => brukere.filter(b => !q || b.navn.toLowerCase().includes(q.toLowerCase())).map(b => ({id: b.id, name: b.navn, avatarUrl: avatar(b.navn), isMe: b.id === me?.id}))
};

function authSide(innhold){
  document.querySelector('.app').hidden = true;
  let w = $('#auth'); if (!w){ w = document.createElement('div'); w.id = 'auth'; w.className = 'auth'; document.body.prepend(w); }
  w.innerHTML = `<div class="card"><div class="brand"><span>LV</span><span class="bar"></span><span>EIENDOM AS</span></div>${innhold}</div>`;
  return w;
}
function feltErr(w, msg){ const e = w.querySelector('.ferr'); e.textContent = msg; e.hidden = false; }
function visLogin(harBrukere){
  if (!harBrukere) return visOppstart();
  const w = authSide(`<h2 style="margin-bottom:6px">Eierportal</h2><p>Logg inn med e-post og passord.</p>
    <form id="lf" novalidate><label class="fld"><span class="lab">E-post</span><input id="l_e" class="inp" type="email" autocomplete="username" required></label>
    <label class="fld"><span class="lab">Passord</span><input id="l_p" class="inp" type="password" autocomplete="current-password" required></label>
    <div class="ferr" hidden></div><button class="btn primary" type="submit">Logg inn</button>
    <p class="small" style="margin-top:8px">Glemt passordet? Be en administrator om en ny lenke.</p></form>`);
  $('#l_e').focus();
  $('#lf').addEventListener('submit', async e => { e.preventDefault();
    try { await api('/api/auth', {action: 'login', epost: $('#l_e').value, passord: $('#l_p').value}); location.reload(); }
    catch (er){ feltErr(w, er.message); } });
}
function visOppstart(){
  const w = authSide(`<h2 style="margin-bottom:6px">Sett opp portalen</h2><p>Opprett den første administratoren. Du trenger oppstartskoden.</p>
    <form id="of" novalidate><label class="fld"><span class="lab">Navn</span><input id="o_n" class="inp" autocomplete="name"></label>
    <label class="fld"><span class="lab">E-post</span><input id="o_e" class="inp" type="email" autocomplete="username"></label>
    <label class="fld"><span class="lab">Passord</span><input id="o_p" class="inp" type="password" autocomplete="new-password"><span class="hint">Minst 10 tegn</span></label>
    <label class="fld"><span class="lab">Oppstartskode</span><input id="o_k" class="inp" autocomplete="off"></label>
    <div class="ferr" hidden></div><button class="btn primary" type="submit">Opprett og logg inn</button></form>`);
  $('#of').addEventListener('submit', async e => { e.preventDefault();
    try { await api('/api/auth', {action: 'oppstart', navn: $('#o_n').value, epost: $('#o_e').value, passord: $('#o_p').value, kode: $('#o_k').value}); location.href = '/'; }
    catch (er){ feltErr(w, er.message); } });
}
async function visInvitasjon(token){
  let info;
  try { info = await api('/api/auth', {action: 'invitasjon-info', token}); }
  catch (er){ authSide(`<h2 style="margin-bottom:6px">Lenken virker ikke</h2><p>${esc(er.message)}</p><a class="btn" href="/">Til innlogging</a>`); return; }
  const w = authSide(`<h2 style="margin-bottom:6px">Velkommen, ${esc(info.navn)}</h2><p>Velg et passord for ${esc(info.epost)}.</p>
    <form id="vf" novalidate><input type="email" autocomplete="username" value="${esc(info.epost)}" hidden>
    <label class="fld"><span class="lab">Passord</span><input id="v_p" class="inp" type="password" autocomplete="new-password"><span class="hint">Minst 10 tegn</span></label>
    <label class="fld"><span class="lab">Gjenta passordet</span><input id="v_p2" class="inp" type="password" autocomplete="new-password"></label>
    <div class="ferr" hidden></div><button class="btn primary" type="submit">Lagre og logg inn</button></form>`);
  $('#v_p').focus();
  $('#vf').addEventListener('submit', async e => { e.preventDefault();
    if ($('#v_p').value !== $('#v_p2').value) return feltErr(w, 'Passordene er ikke like.');
    try { await api('/api/auth', {action: 'invitasjon', token, passord: $('#v_p').value}); location.href = '/'; }
    catch (er){ feltErr(w, er.message); } });
}

(async function init(){
  const inv = new URLSearchParams(location.search).get('invitasjon');
  if (inv){ history.replaceState(null, '', '/'); return visInvitasjon(inv); }
  let a;
  try { a = await api('/api/auth'); }
  catch { authSide('<h2>Får ikke kontakt med serveren</h2><p>Prøv igjen om litt.</p>'); return; }
  if (!a.bruker) return visLogin(a.harBrukere);
  me = {id: a.bruker.id, name: a.bruker.navn, rolle: a.bruker.rolle, avatarUrl: avatar(a.bruker.navn), isOwner: a.bruker.rolle === 'admin'};
  canWrite = a.bruker.rolle === 'admin' || a.bruker.rolle === 'skriv';
  render();
  await hentBrukere();
  renderMe();
  await lastData();
  setInterval(() => { if (document.visibilityState === 'visible' && !M) lastData(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !M) lastData(); });
})();
</script>
